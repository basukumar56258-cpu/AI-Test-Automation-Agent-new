services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testpilot}
      MYSQL_USER: ${MYSQL_USER:-testpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-testpilot}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}@mysql:3306/${MYSQL_DATABASE:-testpilot}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - mysql

volumes:
  mysql_data:
